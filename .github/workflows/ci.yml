name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 ./...

  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -count=1 -run TestImportBoundaryRejectsCoreAndCrossCollectorImports .

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image without pushing it
        run: docker build -t eshu-collector-jira:ci .
      - name: Seed contract
        run: |
          seed="$RUNNER_TEMP/seed"
          mkdir -p "$seed" && chmod 777 "$seed"
          docker run --rm --network none -v "$seed:/component" eshu-collector-jira:ci seed --dest /component
          test -x "$seed/collector"
          test -s "$seed/manifest.yaml"

  ci-complete:
    if: always()
    needs: [vet, test, boundary, image]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "a required job finished with: $result" >&2
              exit 1
            fi
          done
