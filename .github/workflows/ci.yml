# CI gates for eshu-collector-jira (org gate contract, epic #3).
#
# Thin caller over the shared lane bodies in
# eshu-hq/.github/.github/workflows/go-collector-ci.yml (v2, pinned below):
# this file holds the paths-filter `changes` job, the `go-ci` call with
# this repo's run-gate wiring, and the two caller-side jobs the reusable
# cannot own (weekly findings issue, Security-tab upload). Lane bodies
# (lint/test/race/shell/image/boundary/govulncheck/gosec/actionlint and
# the ci-complete aggregator) live upstream; check runs nest as
# `go-ci / <lane>`, so the ruleset requires `go-ci / ci-complete`.
#
# Pinned actions (re-verify with git ls-remote when auditing; Dependabot
# github-actions proposes bumps, weekly grouped):
#   actions/checkout v7.0.1              3d3c42e5aac5ba805825da76410c181273ba90b1
#   dorny/paths-filter v4                ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
#   actions/download-artifact v7         37930b1c2abaa49bbe596cd826c3c89aef350131
#   github/codeql-action/upload-sarif v4.39.1 9b3254085494b55a0f7c4c2b3d2d52cc712ce370
#   eshu-hq/.github v2                   4d01ab90baf5dd77c21cc1ee6bdf701332613449
# Go tools (passed as inputs; hash-verified by the toolchain on install):
#   golangci-lint v2.12.2, govulncheck v1.9.0 (-scan package),
#   gosec v2.30.0 (this repo's measured zero-finding baseline; #11 triaged
#   the seed-dest G301 as a false positive), actionlint v1.7.12 (tarball,
#   sha256-checked upstream).
name: ci

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Weekly scanner record (govulncheck + gosec SARIF). Findings open or
    # update an issue; see the scheduled-findings job.
    - cron: "0 3 * * 1"

# Fork-safe PR lanes: top-level permissions stay empty (the go-ci call
# holds its own contents: read to fetch the upstream definition), and no
# caller step touches a configured secret (only the automatic GITHUB_TOKEN,
# used solely by the weekly-findings issue step).
permissions: {}

# Cancel superseded runs per PR (or per ref for pushes and schedules).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Path selection runs on pull requests and pushes to main. The weekly
    # schedule skips this job and the go-ci call's always() keeps the scan
    # lanes reachable: every run-* input treats a skipped changes job as
    # "no" except the schedule-gated scanners.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      fixtures: ${{ steps.filter.outputs.fixtures }}
      shell: ${{ steps.filter.outputs.shell }}
      deps: ${{ steps.filter.outputs.deps }}
      image: ${{ steps.filter.outputs.image }}
      workflows: ${{ steps.filter.outputs.workflows }}
      misc: ${{ steps.filter.outputs.misc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: 'some-with-excludes'
          filters: |
            go:
              # Go sources plus everything compiled or embedded into the
              # binary: **/*.go (lint, test, race judge the code itself),
              # testdata/** (fixture .go.txt files plus the JSON golden
              # files and cassettes the conformance, parity, and replay
              # tests open), manifest.yaml (go:embed'ed via
              # manifest_embed.go and asserted by cmd/collector/seed_test.go
              # and testsupport_test.go), and the module and lint inputs.
              - '**/*.go'
              - 'testdata/**'
              - 'manifest.yaml'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
            fixtures:
              # Files tests open that are NOT in the go class: the root
              # example fixtures (grant_test.go reads grant.example.json)
              # and the grant-recording script it opens
              # (scripts/record-grants.sh). testdata/** and manifest.yaml
              # also match these globs, but the go class wins for lane
              # routing, so a root-JSON-only PR runs test only while a
              # testdata PR runs lint, test, race.
              - 'testdata/**'
              - '**/*.json'
              - '**/*.yaml'
              - '**/*.yml'
              - '*.example.*'
              - 'scripts/record-grants.sh'
            shell:
              - '**/*.sh'
            deps:
              - 'go.mod'
              - 'go.sum'
            image:
              - 'Dockerfile'
              - '.dockerignore'
              - 'manifest.yaml'
              - 'go.mod'
              - 'go.sum'
            workflows:
              - '.github/workflows/**'
              - '.github/dependabot.yml'
            misc:
              # Fail closed: anything the named classes do not cover still
              # proves the Go lanes (a Makefile edit must show the lanes
              # work). Only docs stay exempt so docs-only PRs run no lane.
              - '**'
              - '!**/*.go'
              - '!go.mod'
              - '!go.sum'
              - '!.golangci.yml'
              - '!manifest.yaml'
              - '!testdata/**'
              - '!**/*.json'
              - '!**/*.yaml'
              - '!**/*.yml'
              - '!*.example.*'
              - '!scripts/record-grants.sh'
              - '!**/*.sh'
              - '!Dockerfile'
              - '!.dockerignore'
              - '!.github/workflows/**'
              - '!.github/dependabot.yml'
              - '!README.md'
              - '!LICENSE'

  go-ci:
    # always(): changes runs only on pull_request/push, so without this the
    # call (and every lane, plus the failure-gated weekly filing job) is
    # skipped on schedule runs.
    if: always()
    needs: [changes]
    # contents:read is the minimum that can fetch the reusable workflow
    # definition upstream; inner jobs run under the reusable's own
    # contents:read declaration. Top-level stays empty (fork-safe).
    permissions:
      contents: read
    # No timeout-minutes here: a reusable-call job accepts only name/uses/
    # with/secrets/needs/if/permissions, so the run ceiling lives in the
    # upstream inner-lane timeouts.
    uses: eshu-hq/.github/.github/workflows/go-collector-ci.yml@4d01ab90baf5dd77c21cc1ee6bdf701332613449 # v2
    with:
      module: jira
      go-version-file: go.mod
      # Total statement coverage floor. May only rise. Measured 92.0% when
      # the gate landed; the finish line is 90%.
      coverage-floor: 90
      run-image: ${{ github.event_name == 'push' || needs.changes.outputs.image == 'true' || needs.changes.outputs.go == 'true' }}
      image-tag: eshu-collector-jira:ci
      image-context: .
      image-command: |
        set -euo pipefail
        seed="$RUNNER_TEMP/seed"
        mkdir -p "$seed" && chmod 777 "$seed"
        docker run --rm --network none -v "$seed:/component" eshu-collector-jira:ci seed --dest /component
        test -x "$seed/collector"
        test -s "$seed/manifest.yaml"
        test -f .dockerignore
        test -z "$(grep -E '^FROM ' Dockerfile | grep -v '@sha256:')"
        test "$(awk '/^go / {print $2}' go.mod)" = "$(grep -E -o 'golang:[0-9.]+' Dockerfile | head -1 | cut -d: -f2)"
      run-lint: ${{ github.event_name == 'push' || needs.changes.outputs.go == 'true' || needs.changes.outputs.workflows == 'true' || needs.changes.outputs.misc == 'true' }}
      # Shell scripts ride along only through the fixtures class:
      # scripts/record-grants.sh is opened by grant_test.go, so editing it
      # selects test; any other script change runs shell only.
      run-test: ${{ github.event_name == 'push' || needs.changes.outputs.go == 'true' || needs.changes.outputs.fixtures == 'true' || needs.changes.outputs.workflows == 'true' || needs.changes.outputs.misc == 'true' }}
      run-race: ${{ github.event_name == 'push' || needs.changes.outputs.go == 'true' || needs.changes.outputs.workflows == 'true' || needs.changes.outputs.misc == 'true' }}
      run-shell: ${{ github.event_name == 'push' || needs.changes.outputs.shell == 'true' }}
      run-boundary: ${{ github.event_name == 'push' || needs.changes.outputs.go == 'true' || needs.changes.outputs.workflows == 'true' || needs.changes.outputs.misc == 'true' }}
      boundary-command: go test -count=1 -run TestImportBoundaryRejectsCoreAndCrossCollectorImports .
      run-govulncheck: ${{ github.event_name == 'push' || github.event_name == 'schedule' || needs.changes.outputs.deps == 'true' }}
      run-gosec: ${{ github.event_name == 'push' || github.event_name == 'schedule' || needs.changes.outputs.go == 'true' || needs.changes.outputs.workflows == 'true' }}
      # Findings fail scheduled runs so the failure()-gated issue job
      # below is reachable; PR runs stay advisory green.
      gosec-fail-on-findings: ${{ github.event_name == 'schedule' }}
      gosec-version: v2.30.0 # this repo's measured zero-finding baseline, see #11
      run-actionlint: ${{ github.event_name == 'push' || github.event_name == 'schedule' || needs.changes.outputs.workflows == 'true' }}

  scheduled-findings:
    # The reusable runs contents:read-only, so weekly issue filing stays a
    # caller job. Fires only when go-ci failed on a schedule event.
    needs: [go-ci]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: file or update the weekly findings issue
        run: |
          title="[ci] weekly scan findings $(date -u +%F)"
          body="Scheduled govulncheck/gosec failed on ${{ github.sha }}. See run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
          open=$(gh issue list --search "$title in:title" --state open --json number --jq '.[0].number')
          if [ -n "$open" ] && [ "$open" != "null" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "$title" --label bug --body "$body"
          fi

  gosec-sarif:
    # Security-tab upload the reusable deliberately omits (fork PRs run
    # read-only): caller-side, non-PR events only, and continue-on-error
    # so a 403 never turns into a silent green no-op. Skips when go-ci
    # failed: the finding count stays in that run's summary and the
    # weekly issue links the run.
    needs: [go-ci]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: gosec-jira
          path: ${{ github.workspace }}
      - name: upload SARIF
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: gosec.sarif
        continue-on-error: true
