# Example component activation config for the Jira collector. Copy it, replace
# the placeholder host and scope, and point the environment variables at real
# credentials. It holds no secrets: token_env and email_env NAME environment
# variables the worker process exports; their values never appear here, in
# facts, in logs, or in statuses.
#
# Cutover identity. When this activation replaces the in-tree Jira collector,
# these values must equal the in-tree ones, or every stable fact key changes:
#   host.scope.id        = the in-tree target's scope_id
#   host.scope.kind      = jira_site
#   host.sourceSystem    = the in-tree source system (jira)
# The activation instance id (--instance) must be a NEW id, different from the
# in-tree collector instance id: a duplicate collector instance id is a
# coordinator configuration error, and the coordinator does not start while the
# duplicate exists. Only the payload's collector_instance_id changes; stable
# keys do not.
# The values below are placeholders. Read the real scope id and source system
# from the live in-tree configuration; do not invent new ones.
host:
  # Source system recorded on every fact. Match the claim the coordinator plans.
  sourceSystem: jira
  scope:
    # One activation covers one Jira target. The scope id is the stable
    # identity of the site; it is part of every stable fact key, so choose it
    # once and keep it.
    id: jira:site:example
    kind: jira_site
process:
  command: ./collector
  args:
    - --sdk-stdio
  # A site with a large issue window returns more than the host's default
  # 4 MiB stdout cap. Raise this together with config.limits.maxResultBytes;
  # the collector fails terminal with result_budget_exceeded rather than let
  # the host drop an oversized result.
  stdout_limit_bytes: 67108864
config:
  site_id: example.atlassian.net
  base_url: https://example.atlassian.net
  email_env: JIRA_EMAIL
  token_env: JIRA_API_TOKEN
  # Exactly one of jql and jql_env is required.
  jql: project = EXAMPLE
  # jql_env: JIRA_JQL
  issue_limit: 50
  updated_lookback: 24h
  changelog_limit: 50
  remote_link_limit: 50
  metadata_limit: 100
  limits:
    maxRecordsPerClaim: 50000
    maxPayloadBytes: 1048576
    maxResultBytes: 50331648
    # Wall-time bound for one claim. The host also kills the process at the
    # claim deadline, which is the initial lease expiry
    # (ESHU_COMPONENT_COLLECTOR_CLAIM_LEASE_TTL, default 60s; heartbeats do not
    # extend it). The collector stops starting provider calls at the deadline
    # minus min(2s, 5% of the time left) and returns retryable
    # claim_deadline_exceeded with no facts. The reference deployment runs the
    # worker lease TTL at 5m (heartbeat 30s); a larger site needs at least that.
    claimTimeoutSeconds: 300
